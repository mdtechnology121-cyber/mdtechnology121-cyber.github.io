<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📥</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.card{background:rgba(255,255,255,.07);backdrop-filter:blur(24px);border-radius:32px;padding:48px 40px;max-width:420px;width:100%;border:1px solid rgba(255,255,255,.08);box-shadow:0 24px 80px rgba(0,0,0,.4)}
.code{font-size:72px;font-weight:800;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:8px}
p{font-size:15px;color:rgba(255,255,255,.6);margin-bottom:28px;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:14px 32px;border-radius:60px;font-size:15px;font-weight:600;text-decoration:none;transition:all .25s;box-shadow:0 4px 20px rgba(102,126,234,.35)}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(102,126,234,.5)}
@media(max-width:480px){.card{padding:32px 20px;border-radius:24px}.code{font-size:56px}}
</style>
</head>
<body>
<div class="card">
<div class="code">404</div>
<p>Looks like this page doesn't exist. The link might be broken, or the page may have been removed.</p>
<a class="btn" href="index.html">← Back to Home</a>
</div>
</body>
</html>
